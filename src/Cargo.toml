[package]
name = "mctier"
version = "3.8.0"
description = "MCTier - Minecraft 虚拟局域网联机工具"
authors = ["MCTier Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mctier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
embed-resource = "3"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
thiserror = "2"
log = "0.4"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "stream", "json", "cookies"] }
cookie_store = "0.22"
urlencoding = "2.1"
base64 = "0.22"
# 聊天鉴权：每个成员一对 P-256 密钥，消息由私钥签名、接收方用信令下发的
# 公钥验签。选 P-256 而非 Ed25519 是为了与 Android 端互通——Android 的
# `KeyPairGenerator("Ed25519")` 要 API 33+，而本项目 minSdk 为 26，
# secp256r1 + SHA256withECDSA 则在所有支持的系统版本上都可用。
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# 高性能文件传输
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
# HTTP 文件服务器
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
async-stream = "0.3"
# ZIP 压缩
zip = "2"
calamine = "0.31"
sherpa-onnx = "=1.13.8"
flate2 = "1"
hound = "3.5"
mctier-image-optimizer = { path = "../shared/image-optimizer" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_Com",
    "Win32_System_TaskScheduler",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

# 发布构建：剥离符号，避免二进制中残留调试信息与开发机绝对路径（见 issue #17 第 11 条）
[profile.release]
strip = true
[dev-dependencies]
proptest = "1"
tempfile = "3"
# 仅测试需要：tower 的 util 特性提供 ServiceExt::oneshot，用于直接驱动 axum Router 断言 CORS 响应头
tower = { version = "0.4", features = ["util"] }
